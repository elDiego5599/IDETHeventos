<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Eventos del Colegio | IDETH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css?v=7">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="logo">
        <img src="/static/img/logoColegio.jpeg" alt="Logo Colegio IDETH" class="navbar-logo-img">
        <span>Eventos IDETH</span>
      </a>

      <div class="nav-buttons" id="nav-auth-buttons">
        <a href="/login" class="btn btn-outline btn-sm">Iniciar sesión</a>
        <a href="/register" class="btn btn-primary btn-sm">Registrarse</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container hero-layout">
      <div class="hero-copy">
        <h1 class="hero-title">Cada encuentro crea una historia.</h1>
        <p class="hero-subtitle">Eventos del colegio IDETH.</p>
        <div class="hero-actions">
          <a href="#eventos" class="btn btn-primary btn-lg">Explorar eventos</a>
          <a href="/register" class="btn btn-secondary btn-lg">Registrarse</a>
        </div>
      </div>
      <div class="hero-media">
        <div class="hero-carousel" id="hero-carousel" aria-label="Eventos recientes del colegio">
          <div class="hero-carousel-track" id="hero-carousel-track" aria-live="polite">
            <div class="hero-carousel-empty">Cargando eventos recientes...</div>
          </div>
          <div class="hero-carousel-dots" id="hero-carousel-dots" role="group" aria-label="Seleccionar evento"></div>
          <div class="hero-carousel-controls">
            <button class="hero-carousel-control" type="button" data-carousel-prev aria-label="Evento anterior"></button>
            <button class="hero-carousel-control" type="button" data-carousel-next aria-label="Evento siguiente"></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <section class="section" id="eventos">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">Agenda escolar</h2>
      </div>

      <div class="search-bar-wrap">
        <input type="text" id="main-search-input" class="search-input" placeholder="Buscar eventos">
      </div>

      <div class="date-filter">
        <label class="date-filter-label" for="filter-date-from">Desde</label>
        <input type="date" id="filter-date-from" class="date-input">
        <label class="date-filter-label" for="filter-date-to">Hasta</label>
        <input type="date" id="filter-date-to" class="date-input">
        <button type="button" id="filter-date-clear" class="btn btn-outline btn-sm">Limpiar fecha</button>
      </div>
      <div class="filters-bar">
        <button class="filter-btn main-filter-btn active" data-filter="todos">Todos</button>
        <button class="filter-btn main-filter-btn" data-filter="proximos">Próximos</button>
        <button class="filter-btn main-filter-btn" data-filter="activos">Hoy</button>
        <button class="filter-btn main-filter-btn" data-filter="pasados">Pasados</button>
      </div>

      <div class="events-grid" id="events-grid">
        <!-- Eventos renderizados por app.js -->
      </div>
    </div>
  </section>

  <!-- Modal Detalle de Evento -->
  <div class="modal-overlay" id="event-detail-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-detail-title">Detalle del Evento</h3>
        <button class="modal-close" onclick="closeModal('event-detail-modal')">&times;</button>
      </div>
      <div class="modal-body" id="modal-detail-body">
        <!-- Contenido dinamico con app.js -->
      </div>
      <div class="modal-footer" id="modal-detail-action">
        <!-- Accion dinamica con app.js -->
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Portal de Eventos IDETH - Colegio IDETH</p>
    </div>
  </footer>

  <script src="/static/js/utils.js?v=4"></script>
  <script src="/static/js/app.js?v=4"></script>
</body>
</html>
