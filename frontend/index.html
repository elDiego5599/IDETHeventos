<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal de Eventos del Colegio | IDETH</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="logo">
        <img src="/static/img/logoColegio.jpeg" alt="Logo Colegio IDETH" class="navbar-logo-img">
        <span>Eventos IDETH</span>
      </a>

      <div class="nav-buttons" id="nav-auth-buttons">
        <a href="/login" class="btn btn-outline btn-sm">Iniciar Sesion</a>
        <a href="/register" class="btn btn-primary btn-sm">Registrarse</a>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="container">
      <img src="/static/img/logoColegio.jpeg" alt="Logo Colegio IDETH" class="hero-logo-img">
      <h1 class="hero-title">Eventos Colegio IDETH</h1>
      <p class="hero-subtitle">Enterate de todas las actividades escolares y participa.</p>
      <div class="hero-actions">
        <a href="#eventos" class="btn btn-primary btn-lg">Ver Eventos</a>
        <a href="/register" class="btn btn-secondary btn-lg">Crear Cuenta</a>
      </div>
    </div>
  </section>

  <section class="section" id="eventos">
    <div class="container">
      <div class="section-header">
        <h2 class="section-title">Eventos Escolares</h2>
        <p class="section-subtitle">Actividades programadas en el colegio</p>
      </div>

      <div class="search-bar-wrap">
        <input type="text" id="main-search-input" class="search-input" placeholder="Buscar evento por nombre, deporte, arte...">
      </div>

      <div class="filters-bar">
        <button class="filter-btn main-filter-btn active" data-filter="todos">Todos</button>
        <button class="filter-btn main-filter-btn" data-filter="proximos">Proximos</button>
        <button class="filter-btn main-filter-btn" data-filter="activos">En Vivo / Hoy</button>
        <button class="filter-btn main-filter-btn" data-filter="pasados">Pasados</button>
      </div>

      <div class="events-grid" id="events-grid">
        <!-- Eventos renderizados por app.js -->
      </div>
    </div>
  </section>

  <!-- Modal Detalle de Evento -->
  <div class="modal-overlay" id="event-detail-modal">
    <div class="modal-container">
      <div class="modal-header">
        <h3 class="modal-title" id="modal-detail-title">Detalle del Evento</h3>
        <button class="modal-close" onclick="closeModal('event-detail-modal')">&times;</button>
      </div>
      <div class="modal-body" id="modal-detail-body">
        <!-- Contenido dinamico con app.js -->
      </div>
      <div class="modal-footer" id="modal-detail-action">
        <!-- Accion dinamica con app.js -->
      </div>
    </div>
  </div>

  <footer class="footer">
    <div class="container">
      <p>Portal de Eventos IDETH - Colegio IDETH</p>
    </div>
  </footer>

  <script src="/static/js/utils.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
