<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesion | IDETHeventos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>

  <header class="navbar">
    <div class="container navbar-container">
      <a href="/" class="logo">
        <img src="/static/img/logoColegio.jpeg" alt="Logo Colegio IDETH" class="navbar-logo-img">
        <span>IDETHeventos</span>
      </a>
      <div class="nav-buttons">
        <a href="/register" class="btn btn-outline btn-sm">Registrarse</a>
      </div>
    </div>
  </header>

  <main class="auth-page-wrapper">
    <div class="auth-card">
      <div class="auth-card-header">
        <img src="/static/img/logoColegio.jpeg" alt="Logo Colegio" class="auth-logo">
        <h1 class="auth-title">Iniciar Sesion</h1>
        <p class="auth-subtitle">Ingresa con tu correo y contrasena</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Correo Electronico</label>
          <input type="email" id="login-email" class="form-control" placeholder="ejemplo@ideth.edu" required>
          <p class="form-hint">Prueba: admin@ideth.edu o estudiante@ideth.edu</p>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Contrasena</label>
          <input type="password" id="login-password" class="form-control" placeholder="Tu contrasena" required>
          <p class="form-hint">Prueba: admin123 o estudiante123</p>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" id="btn-login-submit">
          Ingresar al Portal
        </button>
      </form>

      <div class="auth-footer">
        <p>No tienes cuenta? <a href="/register">Registrate aqui</a></p>
        <a href="/" class="auth-back">Volver al inicio</a>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>Portal de Eventos IDETH - Colegio IDETH</p>
    </div>
  </footer>

  <script src="/static/js/utils.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (AuthStorage.isLoggedIn()) {
        const u = AuthStorage.getUser();
        window.location.href = u?.rol === 'admin' ? '/admin' : '/dashboard';
        return;
      }

      const form = document.getElementById('login-form');
      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        const btn = document.getElementById('btn-login-submit');

        try {
          btn.disabled = true;
          btn.textContent = 'Ingresando...';

          const res = await API.post('/api/auth/login', { email, password });
          AuthStorage.setToken(res.token);
          AuthStorage.setUser(res.usuario);

          showToast(`Bienvenido, ${res.usuario.nombre}`, 'success');
          setTimeout(() => {
            window.location.href = res.usuario.rol === 'admin' ? '/admin' : '/dashboard';
          }, 600);
        } catch (err) {
          showToast(err.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Ingresar al Portal';
        }
      });
    });
  </script>
</body>
</html>
